<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion · Catalogue de Tests</title>
<link rel="stylesheet" href="assets/css/auth.css?v=2026.10.23.1">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <h1>Catalogue de Tests</h1>
    <div class="subtitle">Connectez-vous avec votre compte.</div>

    <div id="msg"></div>

    <form id="login-form">
      <div class="form-row">
        <label for="u">Identifiant</label>
        <input type="text" id="u" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="form-row">
        <label for="p">Mot de passe</label>
        <input type="password" id="p" name="password" autocomplete="current-password" required>
      </div>
      <div class="form-row" id="pat-row" style="display:none;">
        <label for="t">Jeton GitHub (accès aux données)</label>
        <input type="password" id="t" autocomplete="off" placeholder="github_pat_... ou ghp_...">
        <div class="help" style="margin-top:6px;">Demandé une fois par navigateur. Il doit avoir accès au dépôt privé <code id="data-repo"></code>.</div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit">Se connecter</button>
    </form>

    <div class="help" style="margin-top:18px;text-align:center;">
      Les données sont stockées dans un dépôt GitHub privé.<br>
      <a href="#" id="pat-change">Utiliser un autre jeton GitHub</a><br>
      Mot de passe oublie ? Contactez votre admin.
    </div>
  </div>
</div>

<script src="assets/js/config.js?v=2026.10.23.1"></script>
<script src="assets/js/crypto-utils.js?v=2026.10.23.1"></script>
<script src="assets/js/github-api.js?v=2026.10.23.1"></script>
<script src="assets/js/session.js?v=2026.10.23.1"></script>
<script>
(async function () {
  if (QASession.isAuthenticated() && QASession.hasDataAccess()) {
    location.replace('index.html');
    return;
  }

  const msg = document.getElementById('msg');
  const form = document.getElementById('login-form');
  const submit = document.getElementById('submit');
  const patRow = document.getElementById('pat-row');
  document.getElementById('data-repo').textContent = `${QA_CONFIG.owner}/${QA_CONFIG.repo}`;
  if (!QAGitHub.getPat()) patRow.style.display = '';
  document.getElementById('pat-change').addEventListener('click', (e) => {
    e.preventDefault();
    patRow.style.display = '';
    document.getElementById('t').focus();
  });

  function showMsg(text, kind) {
    msg.innerHTML = `<div class="alert alert-${kind}">${text}</div>`;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submit.disabled = true;
    submit.textContent = 'Connexion...';
    msg.innerHTML = '';

    const username = document.getElementById('u').value.trim();
    const password = document.getElementById('p').value;

    try {
      const token = document.getElementById('t').value.trim();
      if (token) {
        const r = await QAGitHub.checkPat(token);
        if (!r.ok) {
          showMsg('Jeton GitHub refusé : ' + r.reason, 'error');
          return;
        }
        QAGitHub.setPat(token);
        document.getElementById('t').value = '';
      } else if (!QAGitHub.getPat()) {
        patRow.style.display = '';
        showMsg('Saisissez votre jeton GitHub.', 'error');
        return;
      }
      const { data } = await QAGitHub.fetchData();
      const user = (data.users || []).find(u => u.username.toLowerCase() === username.toLowerCase());
      if (!user) {
        showMsg('Identifiant ou mot de passe invalide.', 'error');
        return;
      }
      const ok = await QACrypto.verifyPassword(user.username, password, user.passwordHash);
      if (!ok) {
        showMsg('Identifiant ou mot de passe invalide.', 'error');
        return;
      }
      QASession.set({
        username: user.username,
        role: user.role || 'user',
        loginAt: new Date().toISOString(),
        mustChangePassword: !!user.mustChangePassword,
      });
      const params = new URLSearchParams(location.search);
      const next = params.get('next') || 'index.html';
      // Whitelist destinations to avoid open redirect via querystring.
      const allowed = ['index.html', 'admin.html', ''];
      location.replace(allowed.includes(next) ? (next || 'index.html') : 'index.html');
    } catch (err) {
      console.error(err);
      if (['PAT_REQUIRED', 'PAT_INVALID', 'NO_ACCESS'].includes(err.message)) {
        patRow.style.display = '';
        showMsg(QAGitHub.describeError(err), 'error');
      } else {
        showMsg('Impossible de joindre GitHub. Verifiez votre connexion.', 'error');
      }
    } finally {
      submit.disabled = false;
      submit.textContent = 'Se connecter';
    }
  });
})();
</script>
</body>
</html>
